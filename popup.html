<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepSeek 智能解释 & 翻译</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="container">
  <h1 class="title">DeepSeek 智能解释 &amp; 翻译 <span class="version">v3.2.0</span></h1>

  <!-- ═══ 标签切换 ═══ -->
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="explain">📖 解释</button>
    <button class="tab-btn" data-tab="translate">🌐 全文翻译</button>
  </div>

  <!-- ═══ 解释标签设置 ═══ -->
  <div class="tab-panel active" id="panel-explain">
    <div class="section">
      <label class="label" for="explain-model">模型</label>
      <select id="explain-model" class="select">
        <optgroup label="DeepSeek">
          <option value="deepseek-v4-flash">V4-Flash（推荐 · 快速准确）</option>
          <option value="deepseek-v4-pro">V4-Pro（深度推理）</option>
        </optgroup>
        <optgroup label="千问">
          <option value="qwen3.7-flash">Qwen3.7-Flash（高性价比）</option>
        </optgroup>
      </select>
    </div>

    <div class="section">
      <label class="toggle-label">
        <input type="checkbox" id="explain-thinking">
        <span class="toggle-text">深度思考模式</span>
      </label>
      <p class="hint">仅 V4-Pro 支持。开启后解释更深入但耗时更长。</p>
    </div>

    <div class="section" id="explain-effort-section" style="display:none">
      <label class="label" for="explain-effort">思考强度</label>
      <select id="explain-effort" class="select">
        <option value="high">高（推荐）</option>
        <option value="max">最高</option>
      </select>
    </div>

    <div class="section">
      <label class="label" for="explain-language">解释语言偏好</label>
      <select id="explain-language" class="select">
        <option value="auto">自动检测（推荐）</option>
        <option value="zh">始终用中文</option>
        <option value="en">始终用英文</option>
      </select>
    </div>
  </div>

  <!-- ═══ 翻译标签设置 ═══ -->
  <div class="tab-panel" id="panel-translate">
    <div class="section">
      <label class="label" for="translate-model">模型</label>
      <select id="translate-model" class="select">
        <optgroup label="DeepSeek">
          <option value="deepseek-v4-flash">V4-Flash（推荐 · 快速准确）</option>
          <option value="deepseek-v4-pro">V4-Pro（深度推理）</option>
        </optgroup>
        <optgroup label="千问">
          <option value="qwen3.7-flash">Qwen3.7-Flash（高性价比）</option>
        </optgroup>
      </select>
    </div>

    <div class="section">
      <label class="toggle-label">
        <input type="checkbox" id="translate-thinking">
        <span class="toggle-text">深度思考模式</span>
      </label>
      <p class="hint">仅 V4-Pro 支持。开启后翻译更精准但耗时更长。</p>
    </div>

    <div class="section" id="translate-effort-section" style="display:none">
      <label class="label" for="translate-effort">思考强度</label>
      <select id="translate-effort" class="select">
        <option value="high">高（推荐）</option>
        <option value="max">最高</option>
      </select>
    </div>

    <div class="section">
      <label class="label" for="target-language">翻译目标语言</label>
      <select id="target-language" class="select">
        <option value="zh">中文</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="es">Español</option>
        <option value="pt">Português</option>
        <option value="ru">Русский</option>
        <option value="ar">العربية</option>
      </select>
    </div>
  </div>

  <!-- ═══ 通用设置 ═══ -->
  <div class="divider">通用设置</div>

  <div class="section">
    <label class="label" for="api-key">DeepSeek API Key</label>
    <input type="password" id="api-key" class="input" placeholder="sk-...">
    <a class="link" href="https://platform.deepseek.com/api_keys" target="_blank">前往 DeepSeek 开放平台获取 Key →</a>
  </div>

  <div class="section">
    <label class="label" for="qwen-api-key">千问 API Key</label>
    <input type="password" id="qwen-api-key" class="input" placeholder="sk-...">
    <a class="link" href="https://platform.qianwenai.com/home/api-keys" target="_blank">前往千问 AI 平台获取 Key →</a>
  </div>

  <div class="section">
    <label class="toggle-label">
      <input type="checkbox" id="enabled" checked>
      <span class="toggle-text">启用扩展</span>
    </label>
  </div>

  <div class="section">
    <label class="toggle-label">
      <input type="checkbox" id="use-context" checked>
      <span class="toggle-text">结合网页上下文</span>
    </label>
  </div>

  <div class="section">
    <label class="label" for="trigger-mode">触发方式</label>
    <select id="trigger-mode" class="select">
      <option value="auto">选中自动搜索（推荐）</option>
      <option value="contextMenu">右键菜单搜索</option>
    </select>
  </div>

  <div class="section">
    <p class="download-hint">📥 下载位置：浏览器默认下载目录</p>
  </div>

  <button id="save-btn" class="save-btn">💾 保存设置</button>
  <div id="status" class="status"></div>
</div>

<script src="popup.js"></script>
</body>
</html>
