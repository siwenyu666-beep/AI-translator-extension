<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepSeek 智能解释</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="logo">
      <span class="logo-text">DeepSeek 智能解释</span>
      <span class="version-tag">v2.1.3</span>
    </div>

    <div class="section">
      <label class="label" for="api-key">DeepSeek API Key</label>
      <input
        type="password"
        id="api-key"
        placeholder="粘贴你的 DeepSeek API Key…"
        autocomplete="off"
      />
      <div class="hint">
        <a href="https://platform.deepseek.com/api_keys" target="_blank" rel="noopener">
          前往 DeepSeek 开放平台获取 Key →
        </a>
      </div>
    </div>

    <div class="section">
      <label class="label" for="model">模型</label>
      <select id="model">
        <option value="deepseek-v4-flash">DeepSeek-V4-Flash（推荐 · 快速准确）</option>
        <option value="deepseek-v4-pro">DeepSeek-V4-Pro（深度推理）</option>
      </select>
    </div>

    <div class="section">
      <label class="label" for="language">解释语言偏好</label>
      <select id="language">
        <option value="auto">自动检测（推荐）</option>
        <option value="zh">始终用中文</option>
        <option value="en">始终用英文</option>
      </select>
    </div>

    <div class="section toggle-row">
      <label class="label" for="thinking-enabled">深度思考模式</label>
      <label class="switch">
        <input type="checkbox" id="thinking-enabled" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="section" id="effort-section">
      <label class="label" for="reasoning-effort">思考强度</label>
      <select id="reasoning-effort">
        <option value="high">高（推荐）</option>
        <option value="max">最高</option>
      </select>
    </div>

    <div class="section toggle-row">
      <label class="label" for="enabled">启用扩展</label>
      <label class="switch">
        <input type="checkbox" id="enabled" checked />
        <span class="slider"></span>
      </label>
    </div>

    <div class="section toggle-row">
      <label class="label" for="use-context">结合网页上下文</label>
      <label class="switch">
        <input type="checkbox" id="use-context" checked />
        <span class="slider"></span>
      </label>
    </div>

    <div class="section">
      <label class="label" for="trigger-mode">触发方式</label>
      <select id="trigger-mode">
        <option value="auto">选中自动搜索（推荐）</option>
        <option value="contextmenu">右键菜单搜索</option>
      </select>
    </div>

    <div class="section">
      <label class="label" for="download-path">
        下载路径
        <button id="copy-path-btn" class="btn-copy-path" title="复制完整下载路径">📋 复制路径</button>
      </label>
      <input type="text" id="download-path" placeholder="笔记/" />
      <div class="hint-download" id="hint-download">
        📥 路径相对于浏览器默认下载目录<br>
        <span id="path-preview">笔记/</span>DeepSeek解释_时间.txt
        <br><span class="hint-sub">（Edge 设置 → 下载 → 位置 可改默认目录）</span>
      </div>
    </div>

    <div class="section toggle-row">
      <label class="label" for="save-as">手动选择下载位置</label>
      <label class="switch">
        <input type="checkbox" id="save-as" />
        <span class="slider"></span>
      </label>
    </div>
    <div class="hint-download" style="margin-top:0;border-style:solid;border-color:#f59e0b;">
      💡 开启后每次下载弹出另存为对话框，可保存到任意目录
    </div>

    <div class="actions">
      <button id="save-btn" class="btn-primary">💾 保存设置</button>
    </div>

    <div id="status" class="status"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
